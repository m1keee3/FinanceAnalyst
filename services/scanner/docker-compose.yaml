services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  scanner:
    build:
      context: ./
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CONFIG_PATH=/app/config/docker.yaml
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "50050:50050"
